{% macro render(name, initials, image="", size="normal") %}
  <span class="gui-logo-tile" data-size="{{ size }}" role="img" aria-label="{{ name }}">
    {% if image.is_empty() %}
      {{ initials }}
    {% else %}
      <img src="{{ image }}" alt="" loading="lazy">
    {% endif %}
  </span>
{% endmacro %}
{% macro framed(name) %}
  <span class="gui-logo-tile" data-size="modal" role="img" aria-label="{{ name }}"><span class="gui-logo-tile__inset">{{ caller() }}</span></span>
{% endmacro %}

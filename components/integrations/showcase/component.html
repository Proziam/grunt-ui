{% macro render(eyebrow, title, description, href, link_label) %}
  <section class="gui-integration-showcase">
    <header>
      <span>{{ eyebrow }}</span>
      <h2>{{ title }}</h2>
      <p>{{ description }}</p>
    </header>
    <div class="gui-integration-showcase__items">{{ caller() }}</div>
    <footer>
      <a href="{{ href }}">{{ link_label }} →</a>
    </footer>
  </section>
{% endmacro %}

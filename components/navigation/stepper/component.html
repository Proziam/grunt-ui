{% macro render(label, steps, current) %}
  <ol class="gui-stepper" aria-label="{{ label }}">
    {% for step in steps %}
      <li {% if loop.index == current %} aria-current="step"{% else if loop.index < current %} data-complete{% endif %}>
        <span class="gui-stepper__number"
              aria-hidden="true">{% if loop.index < current %}✓{% else %}{{ loop.index }}{% endif %}</span>
        <span>{{ step }}</span>
      </li>
    {% endfor %}
  </ol>
{% endmacro %}
{% macro dots(label, count, current=1) %}
  <nav class="gui-step-dots" aria-label="{{ label }}">
    {% for index in 0..count %}<button type="button" aria-label="Go to step {{ index + 1 }}" data-step-index="{{ index }}"{% if index + 1 == current %} aria-current="step"{% endif %}><span></span></button>{% endfor %}
  </nav>
{% endmacro %}

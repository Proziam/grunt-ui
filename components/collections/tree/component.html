{% macro render(label) %}
  <nav class="gui-tree" aria-label="{{ label }}">
    {{ caller() }}
  </nav>
{% endmacro %}
{% macro branch_open(label, open=false) %}
  <details class="gui-tree__branch"{% if open %} open{% endif %}>
    <summary>{{ label }}</summary>
    <div>
{% endmacro %}
{% macro branch_close() %}
  </div>
  </details>
{% endmacro %}
{% macro leaf(label, href, current=false) %}
  <a class="gui-tree__leaf"
     href="{{ href }}"
     {% if current %} aria-current="page"{% endif %}>{{ label }}</a>
{% endmacro %}

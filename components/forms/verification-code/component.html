{% macro render(id, name, label="Verification code", digits=4, label_visible=true, required=true) %}
  {% let count = digits + 0 %}
  <fieldset class="gui-verification-code" data-gui-verification data-digits="{{ digits }}">
    <legend{% if !label_visible %} class="gui-sr-only"{% endif %}>{{ label }}</legend>
    <div class="gui-verification-code__digits">
      {% for index in 0..count %}
        {% if count == 6 && index == 3 %}<span class="gui-verification-code__separator" aria-hidden="true">−</span>{% endif %}
        <input id="{{ id }}-{{ index }}" name="{{ name }}" type="text" inputmode="numeric" pattern="[0-9]" maxlength="1" placeholder="0" aria-label="Digit {{ index + 1 }} of {{ digits }}"{% if index == 0 %} autocomplete="one-time-code"{% else %} autocomplete="off"{% endif %}{% if required %} required{% endif %}>
      {% endfor %}
    </div>
  </fieldset>
{% endmacro %}

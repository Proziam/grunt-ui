{% macro render(id, name, label, show_label="Show", hide_label="Hide") %}
  <div class="gui-secret" data-gui-secret data-show="{{ show_label }}" data-hide="{{ hide_label }}">
    <label for="{{ id }}">{{ label }}</label>
    <div>
      <input id="{{ id }}" name="{{ name }}" type="password" autocomplete="new-password">
      <button type="button"
              aria-controls="{{ id }}"
              aria-pressed="false"
              data-secret-toggle>{{ show_label }}</button>
    </div>
  </div>
{% endmacro %}

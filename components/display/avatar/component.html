{% macro render(name, initials, size="normal", image="", tone="accent") %}
  <span class="gui-avatar" data-size="{{ size }}"{% if image.is_empty() %} data-tone="{{ tone }}"{% endif %} role="img" aria-label="{{ name }}">
    {% if image.is_empty() %}
      {{ initials }}
    {% else %}
      <img src="{{ image }}" alt="" loading="lazy">
    {% endif %}
  </span>
{% endmacro %}
{% macro group(label, featured=false) %}
  <div class="gui-avatar-group"{% if featured %} data-featured{% endif %} role="group" aria-label="{{ label }}">{{ caller() }}</div>
{% endmacro %}

{% macro render(name, label="", size=20) %}
  <svg class="gui-icon"
       width="{{ size }}"
       height="{{ size }}"
       viewBox="0 0 24 24"
       fill="none"
       stroke="currentColor"
       stroke-width="1.7"
       stroke-linecap="round"
       stroke-linejoin="round"
       {% if label.is_empty() %} aria-hidden="true"{% else %} role="img" aria-label="{{ label }}"{% endif %}>
    {% match name.as_ref() %}
    {% when "check" %}
    <path d="m5 12 4 4L19 6" />
    {% when "close" %}
    <path d="m6 6 12 12M6 18 18 6" />
    {% when "plus" %}
    <path d="M12 5v14M5 12h14" />
    {% when "search" %}
    <circle cx="10.5" cy="10.5" r="6.5" />
    <path d="m16 16 4 4" />
    {% when "arrow" %}
    <path d="M4 12h16m-6-6 6 6-6 6" />
    {% when "settings" %}
    <path d="M4 7h16M4 17h16" />
    <circle cx="9" cy="7" r="3" />
    <circle cx="15" cy="17" r="3" />
    {% when "mail" %}
    <rect x="3" y="5" width="18" height="14" rx="3" />
    <path d="m3 7 9 6 9-6" />
    {% when "workflow" %}
    <rect x="3" y="3" width="6" height="6" rx="2" />
    <rect x="15" y="15" width="6" height="6" rx="2" />
    <path d="M6 9v9h9" />
    {% when "lock" %}
    <rect x="5" y="10" width="14" height="11" rx="2" />
    <path d="M8 10V7a4 4 0 0 1 8 0v3M12 14v3" />
    {% when "file" %}
    <path d="M14 3H6a2 2 0 0 0-2 2v14a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V9zM14 3v6h6M8 14h8M8 17h5" />
    {% when _ %}
    <circle cx="12" cy="12" r="9" />
    <path d="M12 8h.01M12 11v6" />
{% endmatch %}
</svg>
{% endmacro %}
